<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>餐厅区块大亨</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#2b1d14; touch-action:none; }
  #game { width:100vw; height:100vh; }
  canvas { display:block; image-rendering:pixelated; }
</style>
</head>
<body>
<div id="game"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.0/phaser.min.js"></script>
<script>
const TILE_W = 56;
const TILE_H = 28;
const GRID_W = 7;
const GRID_H = 16;
const ORIGIN_X = 486;
const ORIGIN_Y = 200;

function gridToScreen(gx, gy) {
  return {
    x: ORIGIN_X + (gx - gy) * (TILE_W / 2),
    y: ORIGIN_Y + (gx + gy) * (TILE_H / 2)
  };
}

// 菜品数据：station = 制作设备，type = back(后厨) / front(前区)
const DISHES = {
  '番茄炒饭': { price: 28, station: '灶台',   type: 'back' },
  '薯条':     { price: 18, station: '炸锅',   type: 'back' },
  '橙汁':     { price: 15, station: '奶茶机', type: 'front' },
  '鸡肉粥':   { price: 22, station: '煮面炉', type: 'back' },
  '布丁':     { price: 32, station: '冰淇淋机', type: 'front' },
  '鸡米花':   { price: 25, station: '炸锅',   type: 'back' },
  '沙拉':     { price: 20, station: '原材料', type: 'back' },
  '汉堡':     { price: 38, station: '扒炉',   type: 'back' },
  '糯米小丸': { price: 26, station: '电饭煲', type: 'back' },
  '热可可':   { price: 24, station: '咖啡机', type: 'front' },
  '鸡肉卷':   { price: 30, station: '扒炉',   type: 'back' },
  '南瓜挞':   { price: 35, station: '烤箱',   type: 'back' },
};

// 设施布局（按新要求拉开距离）
const FACILITY_LIST = [
  // === 厨房后区 gy 0-4 ===
  { gx: 0, gy: 0, color: 0xe67e22, label: '灶台' },
  { gx: 1, gy: 0, color: 0xe67e22, label: '煮面炉' },
  { gx: 2, gy: 0, color: 0xe67e22, label: '高汤炉' },
  { gx: 3, gy: 0, color: 0xe67e22, label: '烤箱' },
  { gx: 4, gy: 0, color: 0xe67e22, label: '扒炉' },
  { gx: 0, gy: 1, color: 0xe67e22, label: '电饭煲' },
  { gx: 4, gy: 1, color: 0xe67e22, label: '面包机' },
  { gx: 0, gy: 2, color: 0xe67e22, label: '汤锅' },
  { gx: 4, gy: 2, color: 0xe67e22, label: '炸锅' },
  { gx: 0, gy: 3, color: 0xe67e22, label: '原材料' },
  { gx: 0, gy: 4, color: 0x95a5a6, label: '冰箱' },
  { gx: 4, gy: 4, color: 0x9b59b6, label: '出餐台' },

  // === 前区设备 gy 5 ===
  { gx: 0, gy: 5, color: 0x1abc9c, label: '奶茶机' },
  { gx: 1, gy: 5, color: 0x1abc9c, label: '咖啡机' },
  { gx: 2, gy: 5, color: 0x1abc9c, label: '冰淇淋机' },
  { gx: 3, gy: 5, color: 0x95a5a6, label: '菜单屏' },

  // === gy 6-8 留空 ===

  // === 前台 gy 9 ===
  { gx: 0, gy: 9, color: 0x3498db, label: '外卖台' },
  { gx: 1, gy: 9, color: 0x3498db, label: '蛋糕柜' },
  { gx: 2, gy: 9, color: 0x3498db, label: '关东煮' },
  { gx: 3, gy: 9, color: 0x3498db, label: '点餐台' },
  { gx: 4, gy: 9, color: 0x3498db, label: '取餐台' },

  // === 就餐区 gy 11-15 ===
  { gx: 0, gy: 11, color: 0xf1c40f, label: '一人桌' },
  { gx: 0, gy: 12, color: 0xf1c40f, label: '一人桌' },
  { gx: 0, gy: 13, color: 0xf1c40f, label: '一人桌' },
  { gx: 0, gy: 14, color: 0xf1c40f, label: '一人桌' },
  { gx: 0, gy: 15, color: 0xf1c40f, label: '一人桌' },
  { gx: 2, gy: 11, color: 0xf39c12, label: '两人桌' },
  { gx: 2, gy: 13, color: 0xd35400, label: '四人桌' },
  { gx: 2, gy: 15, color: 0xf39c12, label: '两人桌' },
  { gx: 5, gy: 11, color: 0xf39c12, label: '两人桌' },
  { gx: 5, gy: 13, color: 0xd35400, label: '四人桌' },
  { gx: 5, gy: 15, color: 0xf39c12, label: '两人桌' },
];

function MainScene() {
  Phaser.Scene.call(this, { key: 'MainScene' });
}
MainScene.prototype = Object.create(Phaser.Scene.prototype);
MainScene.prototype.constructor = MainScene;

MainScene.prototype.create = function() {
  this.currentOrder = null;
  this.coinCount = 0;
  this.customers = [];
  this.coins = [];
  this.spawnTimer = 0;
  this.spawnInterval = 4000;

  // 排队位（点餐台前方）
  this.queueSlots = [
    { gx: 3, gy: 8 },
    { gx: 2, gy: 8 },
    { gx: 1, gy: 8 },
  ];

  // 餐桌
  this.tableSlots = FACILITY_LIST
    .filter(function(f){ return f.label.indexOf('桌') !== -1; })
    .map(function(f){ return { gx: f.gx, gy: f.gy, occupied: false }; });

  // 网格
  this.graphics = this.add.graphics();
  this.graphics.lineStyle(1, 0x4a2f1e, 0.6);
  for (let gy = 0; gy < GRID_H; gy++) {
    for (let gx = 0; gx < GRID_W; gx++) {
      const p = gridToScreen(gx, gy);
      const points = [
        { x: p.x, y: p.y - TILE_H / 2 },
        { x: p.x + TILE_W / 2, y: p.y },
        { x: p.x, y: p.y + TILE_H / 2 },
        { x: p.x - TILE_W / 2, y: p.y }
      ];
      this.graphics.strokePoints(points, true, true);
    }
  }

  // 分隔线
  this.drawSeparator(4.5);
  this.drawSeparator(5.5);
  this.drawSeparator(9.5);

  // 设施
  this.facilities = [];
  const self = this;
  FACILITY_LIST.forEach(function(f) {
    const pos = gridToScreen(f.gx, f.gy);
    const rect = self.add.rectangle(pos.x, pos.y - 6, 48, 30, f.color).setStrokeStyle(2, 0x000000);
    rect.setDepth(f.gx + f.gy);
    self.add.text(pos.x, pos.y - 6, f.label, {
      fontSize: '10px', color: '#ffffff', fontStyle: 'bold'
    }).setOrigin(0.5).setDepth(f.gx + f.gy + 1);
    self.facilities.push({ gx: f.gx, gy: f.gy, label: f.label, rect: rect });
  });

  // 玩家
  this.playerGridX = 5;
  this.playerGridY = 9;
  const pos = gridToScreen(this.playerGridX, this.playerGridY);
  this.player = this.add.rectangle(pos.x, pos.y - 14, 28, 28, 0x4a90e2).setStrokeStyle(2, 0xffcc66);
  this.player.setDepth(this.playerGridX + this.playerGridY + 1);

  // 厨师
  this.chef = {
    gx: 2, gy: 3, targetGx: 2, targetGy: 3,
    state: 'idle', timer: 0,
    sprite: this.add.rectangle(0, 0, 26, 26, 0xe67e22).setStrokeStyle(2, 0x000000),
    label: this.add.text(0, 0, '厨', { fontSize: '12px', color: '#fff', fontStyle: 'bold' }).setOrigin(0.5)
  };
  this.updateEmployeeSprite(this.chef);

  // 服务员
  this.waiter = {
    gx: 5, gy: 7, targetGx: 5, targetGy: 7,
    state: 'idle', timer: 0,
    sprite: this.add.rectangle(0, 0, 26, 26, 0x1abc9c).setStrokeStyle(2, 0x000000),
    label: this.add.text(0, 0, '服', { fontSize: '12px', color: '#fff', fontStyle: 'bold' }).setOrigin(0.5)
  };
  this.updateEmployeeSprite(this.waiter);

  // 摇杆
  this.joyBase = this.add.circle(150, 1100, 80, 0xffffff, 0.2).setDepth(100);
  this.joyKnob = this.add.circle(150, 1100, 40, 0xffcc66, 0.8).setDepth(101);
  this.isJoyActive = false;
  this.joyStartX = 150;
  this.joyStartY = 1100;
  this.moveX = 0;
  this.moveY = 0;

  this.input.on('pointerdown', function(pointer){
    if (pointer.x < 300 && pointer.y > 900) {
      self.isJoyActive = true;
      self.joyStartX = pointer.x;
      self.joyStartY = pointer.y;
    }
  });
  this.input.on('pointermove', function(pointer){
    if (!self.isJoyActive) return;
    const dx = pointer.x - self.joyStartX;
    const dy = pointer.y - self.joyStartY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const maxDist = 60;
    if (dist > 0) {
      const angle = Math.atan2(dy, dx);
      const clampedDist = Math.min(dist, maxDist);
      const moveDx = Math.cos(angle) * clampedDist;
      const moveDy = Math.sin(angle) * clampedDist;
      self.joyKnob.x = self.joyStartX + moveDx;
      self.joyKnob.y = self.joyStartY + moveDy;
      self.moveX = moveDx / maxDist;
      self.moveY = moveDy / maxDist;
    }
  });
  this.input.on('pointerup', function(){
    self.isJoyActive = false;
    self.moveX = 0;
    self.moveY = 0;
    self.joyKnob.x = 150;
    self.joyKnob.y = 1100;
  });

  // 互动按钮
  this.interactButton = this.add.circle(600, 1100, 60, 0xe74c3c, 0.85).setDepth(100).setVisible(false);
  this.interactButton.setInteractive({ useHandCursor: true });
  this.interactText = this.add.text(600, 1100, '接单', {
    fontSize: '24px', color: '#ffffff', fontStyle: 'bold'
  }).setOrigin(0.5).setDepth(101).setVisible(false);

  // UI
  this.statusText = this.add.text(360, 40, '走到点餐台点单', {
    fontSize: '22px', color: '#ffffff', fontStyle: 'bold'
  }).setOrigin(0.5).setDepth(200);
  this.coinText = this.add.text(680, 90, '金币: 0', {
    fontSize: '22px', color: '#ffcc66', fontStyle: 'bold'
  }).setOrigin(1, 0.5).setDepth(200);
  this.queueText = this.add.text(20, 90, '排队: 0', {
    fontSize: '20px', color: '#ff9999', fontStyle: 'bold'
  }).setOrigin(0, 0.5).setDepth(200);
  this.feedbackText = this.add.text(360, 130, '', {
    fontSize: '26px', color: '#ffcc66', fontStyle: 'bold'
  }).setOrigin(0.5).setDepth(200).setVisible(false);

  // 点餐台互动
  this.interactButton.on('pointerdown', function(){
    if (!self.currentFacility) return;
    if (self.currentFacility.label !== '点餐台') return;
    if (self.currentOrder) {
      self.showFeedback('已有订单进行中！');
      return;
    }
    // 找排队中第一个顾客
    const customer = self.customers.find(function(c){ return c.state === 'waiting'; });
    if (!customer) {
      self.showFeedback('还没有顾客排队');
      return;
    }
    const dishNames = Object.keys(DISHES);
    const dish = dishNames[Math.floor(Math.random() * dishNames.length)];
    const info = DISHES[dish];
    self.currentOrder = {
      dish: dish, price: info.price,
      station: info.station, stationType: info.type,
      customer: customer,
      state: 'new'
    };
    customer.state = 'ordered';
    customer.bubble.setText('?');
    self.showFeedback('新订单：' + dish);
    self.statusText.setText('订单：' + dish);
  });

  this.cursors = this.input.keyboard.createCursorKeys();
  this.keys = this.input.keyboard.addKeys('W,A,S,D');
};

// 分隔线
MainScene.prototype.drawSeparator = function(gy) {
  const left = gridToScreen(0, gy);
  const right = gridToScreen(GRID_W - 1, gy);
  const g = this.add.graphics();
  g.lineStyle(1.5, 0xffcc66, 0.25);
  g.beginPath();
  g.moveTo(left.x - TILE_W / 2, left.y);
  g.lineTo(right.x + TILE_W / 2, right.y);
  g.strokePath();
};

MainScene.prototype.showFeedback = function(msg) {
  const self = this;
  this.feedbackText.setText(msg).setVisible(true);
  this.time.delayedCall(1500, function(){ self.feedbackText.setVisible(false); });
};

// 更新员工显示
MainScene.prototype.updateEmployeeSprite = function(emp) {
  const pos = gridToScreen(emp.gx, emp.gy);
  emp.sprite.x = pos.x;
  emp.sprite.y = pos.y - 14;
  emp.sprite.setDepth(emp.gx + emp.gy + 1);
  emp.label.x = pos.x;
  emp.label.y = pos.y - 14;
  emp.label.setDepth(emp.gx + emp.gy + 2);
};

// 员工移动
MainScene.prototype.moveEmp = function(emp, tx, ty, speed, delta) {
  const dx = tx - emp.gx;
  const dy = ty - emp.gy;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < 0.08) {
    emp.gx = tx; emp.gy = ty;
    return true;
  }
  const step = speed * delta;
  if (step >= dist) {
    emp.gx = tx; emp.gy = ty;
    return true;
  }
  emp.gx += (dx / dist) * step;
  emp.gy += (dy / dist) * step;
  return false;
};

// 找设施坐标
MainScene.prototype.findFacilityPos = function(label) {
  for (let i = 0; i < this.facilities.length; i++) {
    if (this.facilities[i].label === label) {
      return { gx: this.facilities[i].gx, gy: this.facilities[i].gy };
    }
  }
  return null;
};

// =========== 厨师更新 ===========
MainScene.prototype.updateChef = function(delta) {
  const chef = this.chef;
  const order = this.currentOrder;

  if (chef.state === 'idle') {
    // 接后厨订单
    if (order && order.stationType === 'back' && order.state === 'new') {
      const pos = this.findFacilityPos(order.station);
      if (pos) {
        chef.targetGx = pos.gx;
        chef.targetGy = pos.gy;
        chef.state = 'to_station';
        order.state = 'chef_working';
      }
    }
  }
  else if (chef.state === 'to_station') {
    if (this.moveEmp(chef, chef.targetGx, chef.targetGy, 0.008, delta)) {
      chef.state = 'cooking';
      chef.timer = 2500;
    }
  }
  else if (chef.state === 'cooking') {
    chef.timer -= delta;
    if (chef.timer <= 0) {
      const passPos = this.findFacilityPos('出餐台');
      chef.targetGx = passPos.gx;
      chef.targetGy = passPos.gy;
      chef.state = 'to_pass';
    }
  }
  else if (chef.state === 'to_pass') {
    if (this.moveEmp(chef, chef.targetGx, chef.targetGy, 0.008, delta)) {
      if (order) {
        order.state = 'onPass';
        this.showFeedback(order.dish + ' 已放到出餐台');
      }
      chef.state = 'idle';
    }
  }

  this.updateEmployeeSprite(chef);
};

// =========== 服务员更新 ===========
MainScene.prototype.updateWaiter = function(delta) {
  const waiter = this.waiter;
  const order = this.currentOrder;

  if (waiter.state === 'idle') {
    // 优先：出餐台有菜，需要送到取餐台
    if (order && order.state === 'onPass') {
      const pos = this.findFacilityPos('出餐台');
      waiter.targetGx = pos.gx;
      waiter.targetGy = pos.gy;
      waiter.state = 'to_pass';
      order.state = 'waiter_working';
    }
    // 其次：前区订单，服务员直接做
    else if (order && order.stationType === 'front' && order.state === 'new') {
      const pos = this.findFacilityPos(order.station);
      if (pos) {
        waiter.targetGx = pos.gx;
        waiter.targetGy = pos.gy;
        waiter.state = 'to_front_station';
        order.state = 'waiter_working';
      }
    }
  }
  else if (waiter.state === 'to_pass') {
    if (this.moveEmp(waiter, waiter.targetGx, waiter.targetGy, 0.008, delta)) {
      const pickupPos = this.findFacilityPos('取餐台');
      waiter.targetGx = pickupPos.gx;
      waiter.targetGy = pickupPos.gy;
      waiter.state = 'to_pickup_from_pass';
    }
  }
  else if (waiter.state === 'to_pickup_from_pass') {
    if (this.moveEmp(waiter, waiter.targetGx, waiter.targetGy, 0.008, delta)) {
      if (order) {
        order.state = 'onPickup';
        this.showFeedback(order.dish + ' 已送到取餐台');
      }
      waiter.state = 'idle';
    }
  }
  else if (waiter.state === 'to_front_station') {
    if (this.moveEmp(waiter, waiter.targetGx, waiter.targetGy, 0.008, delta)) {
      waiter.state = 'making';
      waiter.timer = 2000;
    }
  }
  else if (waiter.state === 'making') {
    waiter.timer -= delta;
    if (waiter.timer <= 0) {
      const pickupPos = this.findFacilityPos('取餐台');
      waiter.targetGx = pickupPos.gx;
      waiter.targetGy = pickupPos.gy;
      waiter.state = 'to_pickup_from_front';
    }
  }
  else if (waiter.state === 'to_pickup_from_front') {
    if (this.moveEmp(waiter, waiter.targetGx, waiter.targetGy, 0.008, delta)) {
      if (order) {
        order.state = 'onPickup';
        this.showFeedback(order.dish + ' 已送到取餐台');
      }
      waiter.state = 'idle';
    }
  }

  this.updateEmployeeSprite(waiter);
};

// 生成顾客
MainScene.prototype.spawnCustomer = function() {
  const self = this;
  const freeSlot = this.queueSlots.find(function(slot){
    return !self.customers.some(function(c){
      return (c.state === 'walking' || c.state === 'waiting' || c.state === 'ordered') &&
             c.targetGridX === slot.gx && c.targetGridY === slot.gy;
    });
  });
  if (!freeSlot) return;

  const startPos = gridToScreen(-1, 8);
  const rect = this.add.rectangle(startPos.x, startPos.y - 14, 22, 22, 0xff6b6b).setStrokeStyle(2, 0x000000);
  rect.setDepth(50);
  const bubble = this.add.text(startPos.x, startPos.y - 36, '...', {
    fontSize: '12px', color: '#ffffff',
    backgroundColor: '#000000aa', padding: { x: 3, y: 2 }
  }).setOrigin(0.5).setDepth(51);

  this.customers.push({
    gridX: -1, gridY: 8,
    targetGridX: freeSlot.gx, targetGridY: freeSlot.gy,
    state: 'walking',
    rect: rect, bubble: bubble,
    eatTimer: 0,
  });
};

MainScene.prototype.updateCustomers = function(delta) {
  const self = this;
  for (let i = this.customers.length - 1; i >= 0; i--) {
    const c = this.customers[i];

    // 状态切换
    if (c.state === 'eating') {
      c.eatTimer -= delta;
      if (c.eatTimer <= 0) {
        self.spawnCoins(c.gridX, c.gridY, 3);
        // 释放餐桌
        for (let t of self.tableSlots) {
          if (t.occupied && Math.abs(t.gx - c.gridX) < 1 && Math.abs(t.gy - c.gridY) < 1.5) {
            t.occupied = false;
            break;
          }
        }
        c.state = 'leaving';
        c.targetGridX = -2;
        c.targetGridY = 9;
        c.bubble.setText('!');
      }
    }
    // 等待取餐：如果订单已到取餐台，顾客去取餐台
    else if (c.state === 'ordered' && self.currentOrder && self.currentOrder.customer === c && self.currentOrder.state === 'onPickup') {
      const pickupPos = self.findFacilityPos('取餐台');
      c.state = 'walking_to_pickup';
      c.targetGridX = pickupPos.gx;
      c.targetGridY = pickupPos.gy + 1;
    }

    // 移动
    const dx = c.targetGridX - c.gridX;
    const dy = c.targetGridY - c.gridY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const moveSpeed = 0.005 * delta;

    if (dist > 0.08) {
      c.gridX += (dx / dist) * moveSpeed;
      c.gridY += (dy / dist) * moveSpeed;
    } else {
      c.gridX = c.targetGridX;
      c.gridY = c.targetGridY;

      // 到达目标后
      if (c.state === 'walking') {
        c.state = 'waiting';
      }
      else if (c.state === 'walking_to_pickup') {
        // 从取餐台拿到餐，找空桌去坐下
        let freeTable = self.tableSlots.find(function(t){ return !t.occupied; });
        if (freeTable) {
          freeTable.occupied = true;
          c.targetGridX = freeTable.gx;
          c.targetGridY = freeTable.gy - 1;
          c.state = 'walking_to_table';
        } else {
          c.targetGridX = -2;
          c.targetGridY = 9;
          c.state = 'leaving';
        }
      }
      else if (c.state === 'walking_to_table') {
        c.state = 'eating';
        c.eatTimer = 2000;
        c.bubble.setText('~');
        // 订单完成
        if (self.currentOrder && self.currentOrder.customer === c) {
          const price = self.currentOrder.price;
          self.coinCount += price;
          self.coinText.setText('金币: ' + self.coinCount);
          self.currentOrder = null;
          self.statusText.setText('走到点餐台点单');
        }
      }
      else if (c.state === 'leaving') {
        c.rect.destroy();
        c.bubble.destroy();
        this.customers.splice(i, 1);
        continue;
      }
    }

    const pos = gridToScreen(c.gridX, c.gridY);
    c.rect.x = pos.x;
    c.rect.y = pos.y - 14;
    c.bubble.x = pos.x;
    c.bubble.y = pos.y - 36 + Math.sin(this.time.now / 300) * 2;
    c.rect.setDepth(c.gridX + c.gridY + 1);
    c.bubble.setDepth(c.gridX + c.gridY + 2);
  }

  const waitingCount = this.customers.filter(function(c){
    return c.state === 'walking' || c.state === 'waiting';
  }).length;
  this.queueText.setText('排队: ' + waitingCount);
};

MainScene.prototype.spawnCoins = function(gx, gy, count) {
  for (let i = 0; i < count; i++) {
    const pos = gridToScreen(gx + (Math.random() - 0.5) * 0.6, gy + (Math.random() - 0.5) * 0.6);
    const coin = this.add.circle(pos.x, pos.y, 7, 0xffcc66).setStrokeStyle(2, 0x8b6914);
    coin.setDepth(60);
    this.coins.push({
      sprite: coin,
      phase: Math.random() * Math.PI * 2,
      baseY: pos.y,
    });
  }
};

MainScene.prototype.updateCoins = function(delta) {
  for (let i = this.coins.length - 1; i >= 0; i--) {
    const c = this.coins[i];
    c.phase += delta * 0.005;
    const dist = Phaser.Math.Distance.Between(c.sprite.x, c.sprite.y, this.player.x, this.player.y);
    if (dist < 90) {
      const angle = Math.atan2(this.player.y - c.sprite.y, this.player.x - c.sprite.x);
      c.sprite.x += Math.cos(angle) * 6;
      c.sprite.y += Math.sin(angle) * 6;
      if (dist < 18) {
        this.coinCount += 1;
        this.coinText.setText('金币: ' + this.coinCount);
        c.sprite.destroy();
        this.coins.splice(i, 1);
        continue;
      }
    } else {
      c.sprite.y = c.baseY + Math.sin(c.phase) * 3;
    }
  }
};

MainScene.prototype.update = function(time, delta) {
  const self = this;
  const speed = 0.03;
  let dx = this.moveX;
  let dy = this.moveY;
  if (this.cursors.left.isDown || this.keys.A.isDown) dx = -1;
  if (this.cursors.right.isDown || this.keys.D.isDown) dx = 1;
  if (this.cursors.up.isDown || this.keys.W.isDown) dy = -1;
  if (this.cursors.down.isDown || this.keys.S.isDown) dy = 1;

  if (dx !== 0 || dy !== 0) {
    const gridDx = (dx / (TILE_W / 2) + dy / (TILE_H / 2)) / 2;
    const gridDy = (dy / (TILE_H / 2) - dx / (TILE_W / 2)) / 2;
    this.playerGridX += gridDx * delta * speed;
    this.playerGridY += gridDy * delta * speed;
    this.playerGridX = Phaser.Math.Clamp(this.playerGridX, 0, GRID_W - 1);
    this.playerGridY = Phaser.Math.Clamp(this.playerGridY, 0, GRID_H - 1);
    const pos = gridToScreen(this.playerGridX, this.playerGridY);
    this.player.x = pos.x;
    this.player.y = pos.y - 14;
    this.player.setDepth(this.playerGridX + this.playerGridY + 1);
  }

  // 顾客
  this.spawnTimer += delta;
  if (this.spawnTimer > this.spawnInterval) {
    this.spawnTimer = 0;
    this.spawnCustomer();
  }
  this.updateCustomers(delta);

  // 员工
  this.updateChef(delta);
  this.updateWaiter(delta);

  // 金币
  this.updateCoins(delta);

  // 互动按钮（只对点餐台显示）
  let nearPoint = false;
  for (let i = 0; i < this.facilities.length; i++) {
    const f = this.facilities[i];
    if (f.label !== '点餐台') continue;
    const dist = Phaser.Math.Distance.Between(this.playerGridX, this.playerGridY, f.gx, f.gy);
    if (dist < 1.4) nearPoint = true;
  }
  if (nearPoint) {
    this.interactButton.setVisible(true);
    this.interactText.setVisible(true);
  } else {
    this.interactButton.setVisible(false);
    this.interactText.setVisible(false);
  }
};

const config = {
  type: Phaser.AUTO,
  parent: 'game',
  width: 720,
  height: 1280,
  backgroundColor: '#2b1d14',
  pixelArt: true,
  roundPixels: true,
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH
  },
  scene: [MainScene]
};

new Phaser.Game(config);
</script>
