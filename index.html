<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>餐厅区块大亨</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#2b1d14; touch-action:none; }
  #game { width:100vw; height:100vh; }
  canvas { display:block; image-rendering:pixelated; }
</style>
</head>
<body>
<div id="game"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.0/phaser.min.js"></script>
<script>
// ================== 游戏常量 ==================
const TILE_W = 64;     // 瓦片宽
const TILE_H = 32;     // 瓦片高
const GRID_W = 10;     // 横向网格数
const GRID_H = 10;     // 纵向网格数
const ORIGIN_X = 360;  // 原点X
const ORIGIN_Y = 400;  // 原点Y

// ================== 坐标转换 ==================
function gridToScreen(gx, gy) {
  return {
    x: ORIGIN_X + (gx - gy) * (TILE_W / 2),
    y: ORIGIN_Y + (gx + gy) * (TILE_H / 2)
  };
}

// ================== 主场景 ==================
function MainScene() {
  Phaser.Scene.call(this, { key: 'MainScene' });
}
MainScene.prototype = Object.create(Phaser.Scene.prototype);
MainScene.prototype.constructor = MainScene;

MainScene.prototype.create = function() {
  // 1. 绘制等角网格
  this.graphics = this.add.graphics();
  this.graphics.lineStyle(2, 0x4a2f1e, 0.8);
  
  for (let gy = 0; gy < GRID_H; gy++) {
    for (let gx = 0; gx < GRID_W; gx++) {
      const p = gridToScreen(gx, gy);
      const points = [
        { x: p.x, y: p.y - TILE_H / 2 },
        { x: p.x + TILE_W / 2, y: p.y },
        { x: p.x, y: p.y + TILE_H / 2 },
        { x: p.x - TILE_W / 2, y: p.y }
      ];
      this.graphics.strokePoints(points, true, true);
    }
  }

  // 2. 绘制基础餐厅设施（色块占位，对应豆包数据表）
  // 参数：gx, gy, 颜色, 名字
  function addFacility(scene, gx, gy, color, label) {
    const pos = gridToScreen(gx, gy);
    // 设施绘制成一个稍微带点高度的方块
    const rect = scene.add.rectangle(pos.x, pos.y - 10, 44, 30, color).setStrokeStyle(2, 0x000000);
    rect.setDepth(gx + gy); // 等角深度排序
    
    // 名字标签
    scene.add.text(pos.x, pos.y - 10, label, {
      fontSize: '14px', color: '#ffffff', fontStyle: 'bold'
    }).setOrigin(0.5).setDepth(gx + gy + 1);
    
    return rect;
  }

  // 点餐台 (前区)
  addFacility(this, 2, 2, 0x3498db, '点餐台');
  // 灶台 (后区)
  addFacility(this, 8, 8, 0xe67e22, '灶台');
  // 出餐口 (后区)
  addFacility(this, 7, 7, 0x9b59b6, '出餐口');
  // 餐桌 1
  addFacility(this, 4, 5, 0xf1c40f, '餐桌');
  // 餐桌 2
  addFacility(this, 6, 3, 0xf1c40f, '餐桌');
  // 餐桌 3
  addFacility(this, 5, 7, 0xf1c40f, '餐桌');

  // 3. 创建玩家（老板小人）
  this.playerGridX = 4;
  this.playerGridY = 4;
  
  const pos = gridToScreen(this.playerGridX, this.playerGridY);
  this.player = this.add.rectangle(pos.x, pos.y - 16, 32, 32, 0x4a90e2).setStrokeStyle(2, 0xffcc66);
  this.player.setDepth(this.playerGridX + this.playerGridY + 1); // 深度排序

  // 4. 创建虚拟摇杆
  this.joyBase = this.add.circle(150, 1100, 80, 0xffffff, 0.2).setDepth(100);
  this.joyKnob = this.add.circle(150, 1100, 40, 0xffcc66, 0.8).setDepth(101);
  
  this.isJoyActive = false;
  this.joyStartX = 150;
  this.joyStartY = 1100;
  this.moveX = 0;
  this.moveY = 0;

  // 摇杆触摸事件
  this.input.on('pointerdown', (pointer) => {
    if (pointer.x < 300 && pointer.y > 900) {
      this.isJoyActive = true;
      this.joyStartX = pointer.x;
      this.joyStartY = pointer.y;
    }
  });

  this.input.on('pointermove', (pointer) => {
    if (!this.isJoyActive) return;
    const dx = pointer.x - this.joyStartX;
    const dy = pointer.y - this.joyStartY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const maxDist = 60;
    
    if (dist > 0) {
      const angle = Math.atan2(dy, dx);
      const clampedDist = Math.min(dist, maxDist);
      const moveDx = Math.cos(angle) * clampedDist;
      const moveDy = Math.sin(angle) * clampedDist;
      
      this.joyKnob.x = this.joyStartX + moveDx;
      this.joyKnob.y = this.joyStartY + moveDy;
      
      this.moveX = moveDx / maxDist;
      this.moveY = moveDy / maxDist;
    }
  });

  this.input.on('pointerup', () => {
    this.isJoyActive = false;
    this.moveX = 0;
    this.moveY = 0;
    this.joyKnob.x = 150;
    this.joyKnob.y = 1100;
  });

  // 键盘支持
  this.cursors = this.input.keyboard.createCursorKeys();
  this.keys = this.input.keyboard.addKeys('W,A,S,D');
};

MainScene.prototype.update = function(time, delta) {
  const speed = 0.005;
  let dx = this.moveX;
  let dy = this.moveY;

  if (this.cursors.left.isDown || this.keys.A.isDown) dx = -1;
  if (this.cursors.right.isDown || this.keys.D.isDown) dx = 1;
  if (this.cursors.up.isDown || this.keys.W.isDown) dy = -1;
  if (this.cursors.down.isDown || this.keys.S.isDown) dy = 1;

  if (dx !== 0 || dy !== 0) {
    const gridDx = (dx / (TILE_W / 2) + dy / (TILE_H / 2)) / 2;
    const gridDy = (dy / (TILE_H / 2) - dx / (TILE_W / 2)) / 2;

    this.playerGridX += gridDx * delta * speed;
    this.playerGridY += gridDy * delta * speed;

    this.playerGridX = Phaser.Math.Clamp(this.playerGridX, 0, GRID_W - 1);
    this.playerGridY = Phaser.Math.Clamp(this.playerGridY, 0, GRID_H - 1);

    const pos = gridToScreen(this.playerGridX, this.playerGridY);
    this.player.x = pos.x;
    this.player.y = pos.y - 16;
    this.player.setDepth(this.playerGridX + this.playerGridY + 1); // 动态深度排序
  }
};

const config = {
  type: Phaser.AUTO,
  parent: 'game',
  width: 720,
  height: 1280,
  backgroundColor: '#2b1d14',
  pixelArt: true,
  roundPixels: true,
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH
  },
  scene: [MainScene]
};

new Phaser.Game(config);
</script>
</body>
</html>
