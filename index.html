<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>餐厅区块大亨</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#2b1d14; touch-action:none; }
  #game { width:100vw; height:100vh; }
  canvas { display:block; image-rendering:pixelated; }
</style>
</head>
<body>
<div id="game"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.0/phaser.min.js"></script>
<script>
const TILE_W = 56;
const TILE_H = 28;
const GRID_W = 8;
const GRID_H = 17;
const ORIGIN_X = 486;
const ORIGIN_Y = 470;   // ★ 从 220 改到 470，地图下移居中

const TOP_BAR_H = 90;
const TIME_STEP_MS = 1250;

function gridToScreen(gx, gy) {
  return {
    x: ORIGIN_X + (gx - gy) * (TILE_W / 2),
    y: ORIGIN_Y + (gx + gy) * (TILE_H / 2)
  };
}

const DISHES = {
  '番茄炒饭': { price: 28, station: '灶台',   type: 'back' },
  '薯条':     { price: 18, station: '炸锅',   type: 'back' },
  '橙汁':     { price: 15, station: '奶茶机', type: 'front' },
  '鸡肉粥':   { price: 22, station: '煮面炉', type: 'back' },
  '布丁':     { price: 32, station: '冰淇淋机', type: 'front' },
  '鸡米花':   { price: 25, station: '炸锅',   type: 'back' },
  '沙拉':     { price: 20, station: '原材料', type: 'back' },
  '汉堡':     { price: 38, station: '扒炉',   type: 'back' },
  '糯米小丸': { price: 26, station: '电饭煲', type: 'back' },
  '热可可':   { price: 24, station: '咖啡机', type: 'front' },
  '鸡肉卷':   { price: 30, station: '扒炉',   type: 'back' },
  '南瓜挞':   { price: 35, station: '烤箱',   type: 'back' },
  '蛋糕':     { price: 28, station: '蛋糕柜', type: 'front' },
  '关东煮':   { price: 26, station: '关东煮', type: 'front' },
};

const FACILITY_LIST = [
  { gx: 0, gy: 0, color: 0xe67e22, label: '灶台' },
  { gx: 1, gy: 0, color: 0xe67e22, label: '煮面炉' },
  { gx: 2, gy: 0, color: 0xe67e22, label: '高汤炉' },
  { gx: 3, gy: 0, color: 0xe67e22, label: '烤箱' },
  { gx: 4, gy: 0, color: 0xe67e22, label: '扒炉' },
  { gx: 0, gy: 1, color: 0xe67e22, label: '电饭煲' },
  { gx: 7, gy: 1, color: 0xe67e22, label: '面包机' },
  { gx: 0, gy: 2, color: 0xe67e22, label: '汤锅' },
  { gx: 7, gy: 2, color: 0xe67e22, label: '炸锅' },
  { gx: 0, gy: 3, color: 0xe67e22, label: '原材料' },
  { gx: 7, gy: 3, color: 0x95a5a6, label: '洗碗池' },
  { gx: 0, gy: 4, color: 0x95a5a6, label: '冰箱' },
  { gx: 7, gy: 4, color: 0x9b59b6, label: '出餐台' },
  { gx: 0, gy: 5, color: 0x1abc9c, label: '奶茶机' },
  { gx: 1, gy: 5, color: 0x1abc9c, label: '咖啡机' },
  { gx: 2, gy: 5, color: 0x1abc9c, label: '冰淇淋机' },
  { gx: 3, gy: 5, color: 0x95a5a6, label: '菜单屏' },
  { gx: 4, gy: 5, color: 0x7f8c8d, label: '工作电脑' },
  { gx: 0, gy: 8, color: 0x3498db, label: '外卖台' },
  { gx: 1, gy: 8, color: 0x3498db, label: '蛋糕柜' },
  { gx: 2, gy: 8, color: 0x3498db, label: '关东煮' },
  { gx: 3, gy: 8, color: 0x3498db, label: '点餐台' },
  { gx: 4, gy: 8, color: 0x3498db, label: '取餐台' },
  { gx: 7, gy: 8, color: 0x95a5a6, label: '清洗区' },
  { gx: 0, gy: 11, color: 0xf1c40f, label: '一人桌' },
  { gx: 2, gy: 11, color: 0xf39c12, label: '两人桌' },
  { gx: 3, gy: 11, color: 0xf39c12, label: '两人桌' },
  { gx: 5, gy: 11, color: 0xf39c12, label: '两人桌' },
  { gx: 6, gy: 11, color: 0xf39c12, label: '两人桌' },
  { gx: 0, gy: 12, color: 0xf1c40f, label: '一人桌' },
  { gx: 0, gy: 13, color: 0xf1c40f, label: '一人桌' },
  { gx: 2, gy: 13, color: 0xd35400, label: '四人桌' },
  { gx: 3, gy: 13, color: 0xd35400, label: '四人桌' },
  { gx: 5, gy: 13, color: 0xd35400, label: '四人桌' },
  { gx: 6, gy: 13, color: 0xd35400, label: '四人桌' },
  { gx: 0, gy: 14, color: 0xf1c40f, label: '一人桌' },
  { gx: 0, gy: 15, color: 0xf1c40f, label: '一人桌' },
  { gx: 2, gy: 15, color: 0xf39c12, label: '两人桌' },
  { gx: 3, gy: 15, color: 0xf39c12, label: '两人桌' },
  { gx: 4, gy: 15, color: 0x8b4513, label: '大门' },
  { gx: 5, gy: 15, color: 0xf39c12, label: '两人桌' },
  { gx: 6, gy: 15, color: 0xf39c12, label: '两人桌' },
];

function MainScene() {
  Phaser.Scene.call(this, { key: 'MainScene' });
}
MainScene.prototype = Object.create(Phaser.Scene.prototype);
MainScene.prototype.constructor = MainScene;

MainScene.prototype.create = function() {
  this.orders = [];
  this.coinCount = 0;
  this.dirtyPlates = 0;
  this.customers = [];
  this.dirtyTables = [];
  this.spawnTimer = 0;
  this.spawnInterval = 5000;
  this.menuOpen = false;
  this.menuPanelItems = null;

  this.gameMinutes = 360;
  this.gameDay = 1;
  this.gameMonth = 1;
  this.gameYear = 1;
  this.timeAccum = 0;

  this.stars = 0;
  this.level = 1;

  this.dishEnabled = {};
  const self = this;
  Object.keys(DISHES).forEach(function(name){ self.dishEnabled[name] = true; });

  this.queueSlots = [
    { gx: 3, gy: 9 }, { gx: 3, gy: 10 }, { gx: 3, gy: 11 },
  ];
  this.pickupSlots = [
    { gx: 4, gy: 9 }, { gx: 4, gy: 10 }, { gx: 4, gy: 11 },
  ];

  this.tableSlots = FACILITY_LIST
    .filter(function(f){ return f.label.indexOf('桌') !== -1; })
    .map(function(f){ return { gx: f.gx, gy: f.gy, state: 'free', bell: false, eaters: 0 }; });

  // 网格
  this.graphics = this.add.graphics();
  this.graphics.lineStyle(1, 0x4a2f1e, 0.5);
  for (let gy = 0; gy < GRID_H; gy++) {
    for (let gx = 0; gx < GRID_W; gx++) {
      const p = gridToScreen(gx, gy);
      const points = [
        { x: p.x, y: p.y - TILE_H / 2 },
        { x: p.x + TILE_W / 2, y: p.y },
        { x: p.x, y: p.y + TILE_H / 2 },
        { x: p.x - TILE_W / 2, y: p.y }
      ];
      this.graphics.strokePoints(points, true, true);
    }
  }

  this.drawSeparator(4.5);
  this.drawSeparator(5.5);
  this.drawSeparator(10.5);

  const qPos = gridToScreen(3, 9);
  this.add.text(qPos.x - 55, qPos.y + 5, '点餐队', {
    fontSize: '12px', color: '#ff9999'
  }).setOrigin(0.5).setDepth(3);
  const pPos = gridToScreen(4, 9);
  this.add.text(pPos.x + 55, pPos.y + 5, '取餐队', {
    fontSize: '12px', color: '#99ccff'
  }).setOrigin(0.5).setDepth(3);

  this.addDoorMarker(4, 8);
  this.addDoorMarker(7, 8);

  this.facilities = [];
  FACILITY_LIST.forEach(function(f) {
    const pos = gridToScreen(f.gx, f.gy);
    const rect = self.add.rectangle(pos.x, pos.y - 6, 48, 30, f.color).setStrokeStyle(2, 0x000000);
    rect.setDepth(f.gx + f.gy);
    self.add.text(pos.x, pos.y - 6, f.label, {
      fontSize: '10px', color: '#ffffff', fontStyle: 'bold'
    }).setOrigin(0.5).setDepth(f.gx + f.gy + 1);
    self.facilities.push({ gx: f.gx, gy: f.gy, label: f.label, rect: rect });
  });

  this.playerGridX = 5;
  this.playerGridY = 10;
  const pos = gridToScreen(this.playerGridX, this.playerGridY);
  this.player = this.add.rectangle(pos.x, pos.y - 14, 28, 28, 0x4a90e2).setStrokeStyle(2, 0xffcc66);
  this.player.setDepth(this.playerGridX + this.playerGridY + 1);

  this.chef    = this.makeEmployee(2, 3,  0xe67e22, '厨');
  this.waiter  = this.makeEmployee(5, 7,  0x1abc9c, '送');
  this.server  = this.makeEmployee(2, 10, 0xf1c40f, '服');
  this.cleaner = this.makeEmployee(6, 9,  0xffffff, '洗');

  // 摇杆（中偏下位置）
  this.joyBase = this.add.circle(130, 1050, 75, 0xffffff, 0.2).setDepth(100);
  this.joyKnob = this.add.circle(130, 1050, 38, 0xffcc66, 0.8).setDepth(101);
  this.isJoyActive = false;
  this.joyStartX = 130;
  this.joyStartY = 1050;
  this.moveX = 0;
  this.moveY = 0;
  const joyMaxDist = 58;

  this.input.on('pointerdown', function(pointer){
    if (pointer.x < 280 && pointer.y > 900 && pointer.y < 1160) {
      self.isJoyActive = true;
      self.joyStartX = pointer.x;
      self.joyStartY = pointer.y;
    }
  });
  this.input.on('pointermove', function(pointer){
    if (!self.isJoyActive) return;
    const dx = pointer.x - self.joyStartX;
    const dy = pointer.y - self.joyStartY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 0) {
      const angle = Math.atan2(dy, dx);
      const cd = Math.min(dist, joyMaxDist);
      const moveDx = Math.cos(angle) * cd;
      const moveDy = Math.sin(angle) * cd;
      self.joyKnob.x = self.joyStartX + moveDx;
      self.joyKnob.y = self.joyStartY + moveDy;
      self.moveX = moveDx / joyMaxDist;
      self.moveY = moveDy / joyMaxDist;
    }
  });
  this.input.on('pointerup', function(){
    self.isJoyActive = false;
    self.moveX = 0;
    self.moveY = 0;
    self.joyKnob.x = 130;
    self.joyKnob.y = 1050;
  });

  // 互动按钮
  this.interactButton = this.add.circle(590, 1050, 58, 0xe74c3c, 0.85).setDepth(100).setVisible(false);
  this.interactButton.setInteractive({ useHandCursor: true });
  this.interactText = this.add.text(590, 1050, '接单+收钱', {
    fontSize: '18px', color: '#ffffff', fontStyle: 'bold'
  }).setOrigin(0.5).setDepth(101).setVisible(false);

  // ===== 顶部状态栏 =====
  this.add.rectangle(360, TOP_BAR_H/2, 720, TOP_BAR_H, 0x000000, 0.78).setDepth(400);
  this.add.rectangle(360, TOP_BAR_H, 720, 2, 0xffcc66, 0.5).setDepth(401);
  this.timeText = this.add.text(20, 22, '1年1月 06:00', {
    fontSize: '22px', color: '#ffffff', fontStyle: 'bold'
  }).setDepth(402);
  this.timeText2 = this.add.text(20, 52, '第1天', {
    fontSize: '16px', color: '#aaaaaa'
  }).setDepth(402);
  this.levelText = this.add.text(360, 15, 'Lv.1', {
    fontSize: '24px', color: '#ffcc66', fontStyle: 'bold'
  }).setOrigin(0.5, 0).setDepth(402);
  this.starText = this.add.text(360, 50, '⭐ 0 / 25', {
    fontSize: '16px', color: '#ffff99'
  }).setOrigin(0.5, 0).setDepth(402);
  this.coinText = this.add.text(700, 22, '0 G', {
    fontSize: '22px', color: '#ffcc66', fontStyle: 'bold'
  }).setOrigin(1, 0).setDepth(402);
  this.coinLabel = this.add.text(700, 52, '金钱', {
    fontSize: '14px', color: '#aaaaaa'
  }).setOrigin(1, 0).setDepth(402);

  this.feedbackText = this.add.text(360, TOP_BAR_H + 40, '', {
    fontSize: '24px', color: '#ffcc66', fontStyle: 'bold'
  }).setOrigin(0.5).setDepth(200).setVisible(false);

  // ===== 底部 5 按钮（居中，全可见）=====
  const btnLabels = ['建造', '公告栏', '观光', '店铺', '菜单'];
  const btnColors = [0x3498db, 0x9b59b6, 0x1abc9c, 0xe67e22, 0xc0392b];
  this.bottomButtons = [];
  // 按钮宽 120，间距 144（12 + 60 + i*144）
  for (let i = 0; i < 5; i++) {
    const cx = 72 + i * 144;
    const cy = 1180;
    const bg = this.add.rectangle(cx, cy, 120, 70, btnColors[i], 0.92)
      .setStrokeStyle(2, 0xffcc66).setDepth(400);
    bg.setInteractive({ useHandCursor: true });
    const label = this.add.text(cx, cy, btnLabels[i], {
      fontSize: '20px', color: '#ffffff', fontStyle: 'bold'
    }).setOrigin(0.5).setDepth(401);
    const idx = i;
    bg.on('pointerdown', function(){
      self.openBottomPanel(idx);
    });
    this.bottomButtons.push({ bg: bg, label: label });
  }

  // 互动按钮逻辑
  this.interactButton.on('pointerdown', function(){
    if (!self.currentFacility) return;
    if (self.currentFacility.label === '工作电脑') {
      self.openMenuPanel();
      return;
    }
    if (self.currentFacility.label !== '点餐台') return;
    const customer = self.customers.find(function(c){ return c.state === 'waiting'; });
    if (!customer) { self.showFeedback('还没有顾客排队'); return; }
    const dish = self.pickRandomDish();
    if (!dish) { self.showFeedback('菜单全关了！去电脑开几个菜'); return; }
    const info = DISHES[dish];
    const spot = self.pickupSlots.find(function(s){
      return !self.customers.some(function(c){
        return (c.state === 'to_pickup_queue' || c.state === 'pickup_waiting') &&
               c.targetGridX === s.gx && c.targetGridY === s.gy;
      });
    });
    const order = {
      dish: dish, price: info.price,
      station: info.station, type: info.type,
      customer: customer, delivery: 'pickup', stage: 'new'
    };
    self.orders.push(order);
    customer.order = order;
    customer.state = 'to_pickup_queue';
    if (spot) {
      customer.targetGridX = spot.gx;
      customer.targetGridY = spot.gy;
    }
    customer.bubble.setText('?');
    self.coinCount += info.price;
    self.updateCoinDisplay();
    self.showFeedback('收银成功：' + dish + ' +' + info.price);
    self.updateOrderCount();
  });

  this.cursors = this.input.keyboard.createCursorKeys();
  this.keys = this.input.keyboard.addKeys('W,A,S,D');
};

MainScene.prototype.updateCoinDisplay = function() {
  this.coinText.setText(this.coinCount + ' G');
};

MainScene.prototype.updateLevelDisplay = function() {
  this.levelText.setText('Lv.' + this.level);
  this.starText.setText('⭐ ' + this.stars + ' / 25');
};

MainScene.prototype.addStars = function(n) {
  if (this.level >= 100) return;
  this.stars += n;
  while (this.stars >= 25 && this.level < 100) {
    this.stars -= 25;
    this.level += 1;
    const reward = 200 * this.level;
    this.coinCount += reward;
    this.showFeedback('🎉 升级！Lv.' + this.level + ' +' + reward + 'G');
  }
  this.updateLevelDisplay();
  this.updateCoinDisplay();
};

MainScene.prototype.pickRandomDish = function() {
  const enabled = Object.keys(DISHES).filter(function(name){
    return this.dishEnabled[name];
  }, this);
  if (enabled.length === 0) return null;
  return enabled[Math.floor(Math.random() * enabled.length)];
};

MainScene.prototype.openMenuPanel = function() {
  if (this.menuOpen) return;
  this.menuOpen = true;
  const self = this;
  const items = [];
  items.push(this.add.rectangle(360, 640, 660, 1000, 0x000000, 0.93).setDepth(500));
  items.push(this.add.rectangle(360, 640, 660, 1000, 0x000000, 0).setStrokeStyle(4, 0xffcc66).setDepth(501));
  items.push(this.add.text(360, 200, '菜单管理', {
    fontSize: '32px', color: '#ffcc66', fontStyle: 'bold'
  }).setOrigin(0.5).setDepth(502));
  items.push(this.add.text(360, 245, '点击菜品 开启 / 关闭', {
    fontSize: '16px', color: '#aaaaaa'
  }).setOrigin(0.5).setDepth(502));

  const dishNames = Object.keys(DISHES);
  const startY = 320, rowH = 68;
  dishNames.forEach(function(name, idx){
    const col = idx % 2;
    const row = Math.floor(idx / 2);
    const x = 360 + (col === 0 ? -150 : 150);
    const y = startY + row * rowH;
    const enabled = self.dishEnabled[name];
    const itemBg = self.add.rectangle(x, y, 285, 58,
      enabled ? 0x1e5f2a : 0x5f1e1e, 0.85)
      .setStrokeStyle(2, enabled ? 0x33cc55 : 0xcc3333).setDepth(502);
    itemBg.setInteractive({ useHandCursor: true });
    itemBg.on('pointerdown', function(){
      self.dishEnabled[name] = !self.dishEnabled[name];
      items.forEach(function(it){ it.destroy(); });
      self.menuOpen = false;
      self.openMenuPanel();
    });
    items.push(itemBg);
    items.push(self.add.text(x, y, (enabled ? '✅ ' : '❌ ') + name, {
      fontSize: '20px', color: '#ffffff', fontStyle: 'bold'
    }).setOrigin(0.5).setDepth(503));
  });

  const closeBg = this.add.rectangle(360, 1060, 240, 64, 0xcc3333).setDepth(502);
  closeBg.setInteractive({ useHandCursor: true });
  closeBg.on('pointerdown', function(){
    items.forEach(function(it){ it.destroy(); });
    self.menuOpen = false;
  });
  items.push(closeBg);
  items.push(this.add.text(360, 1060, '关闭', {
    fontSize: '26px', color: '#ffffff', fontStyle: 'bold'
  }).setOrigin(0.5).setDepth(503));
  this.menuPanelItems = items;
};

MainScene.prototype.openBottomPanel = function(idx) {
  if (this.menuOpen) return;
  this.menuOpen = true;
  const self = this;
  const items = [];
  const titles = ['建造', '公告栏', '观光', '店铺', '菜单'];
  const title = titles[idx];

  items.push(this.add.rectangle(360, 640, 660, 1000, 0x000000, 0.93).setDepth(500));
  items.push(this.add.rectangle(360, 640, 660, 1000, 0x000000, 0).setStrokeStyle(4, 0xffcc66).setDepth(501));
  items.push(this.add.text(360, 200, title, {
    fontSize: '32px', color: '#ffcc66', fontStyle: 'bold'
  }).setOrigin(0.5).setDepth(502));

  if (idx === 4) {
    items.push(this.add.text(360, 250, '菜品列表（只读）', {
      fontSize: '16px', color: '#aaaaaa'
    }).setOrigin(0.5).setDepth(502));
    const dishNames = Object.keys(DISHES);
    const startY = 310, rowH = 55;
    dishNames.forEach(function(name, i){
      const info = DISHES[name];
      const enabled = self.dishEnabled[name];
      const y = startY + i * rowH;
      const color = enabled ? '#ffffff' : '#666666';
      const status = enabled ? '✅' : '❌';
      items.push(self.add.text(80, y, status + ' ' + name, {
        fontSize: '18px', color: color
      }).setDepth(502));
      items.push(self.add.text(640, y, info.price + 'G', {
        fontSize: '18px', color: '#ffcc66'
      }).setOrigin(1, 0).setDepth(502));
    });
  } else {
    items.push(this.add.text(360, 640, title + ' 功能\n\n开发中…', {
      fontSize: '28px', color: '#ffffff', textAlign: 'center'
    }).setOrigin(0.5).setDepth(502));
  }

  const closeBg = this.add.rectangle(360, 1120, 240, 64, 0xcc3333).setDepth(502);
  closeBg.setInteractive({ useHandCursor: true });
  closeBg.on('pointerdown', function(){
    items.forEach(function(it){ it.destroy(); });
    self.menuOpen = false;
  });
  items.push(closeBg);
  items.push(this.add.text(360, 1120, '关闭', {
    fontSize: '26px', color: '#ffffff', fontStyle: 'bold'
  }).setOrigin(0.5).setDepth(503));
};

MainScene.prototype.addDoorMarker = function(gx, gy) {
  const pos = gridToScreen(gx, gy);
  this.add.rectangle(pos.x, pos.y + 14, 56, 6, 0x8b4513).setDepth(200);
  this.add.text(pos.x, pos.y + 14, '🚪', {
    fontSize: '14px'
  }).setOrigin(0.5).setDepth(201);
};

MainScene.prototype.updateOrderCount = function() {
  this.orderText && this.orderText.setText('进行中订单: ' + this.orders.length);
};

MainScene.prototype.makeEmployee = function(gx, gy, color, tag) {
  const emp = {
    gx: gx, gy: gy, tx: gx, ty: gy,
    state: 'idle', timer: 0,
    currentOrder: null,
    currentTable: null,
    sprite: this.add.rectangle(0, 0, 26, 26, color).setStrokeStyle(2, 0x000000),
    label: this.add.text(0, 0, tag, {
      fontSize: '12px',
      color: color === 0xffffff ? '#000' : '#fff',
      fontStyle: 'bold'
    }).setOrigin(0.5)
  };
  this.updateEmployeeSprite(emp);
  return emp;
};

MainScene.prototype.setEmployeeTag = function(emp, tag) { emp.label.setText(tag); };

MainScene.prototype.drawSeparator = function(gy) {
  const left = gridToScreen(0, gy);
  const right = gridToScreen(GRID_W - 1, gy);
  const g = this.add.graphics();
  g.lineStyle(1.5, 0xffcc66, 0.25);
  g.beginPath();
  g.moveTo(left.x - TILE_W / 2, left.y);
  g.lineTo(right.x + TILE_W / 2, right.y);
  g.strokePath();
};

MainScene.prototype.showFeedback = function(msg) {
  const self = this;
  this.feedbackText.setText(msg).setVisible(true);
  this.time.delayedCall(1500, function(){ self.feedbackText.setVisible(false); });
};

MainScene.prototype.updateEmployeeSprite = function(emp) {
  const pos = gridToScreen(emp.gx, emp.gy);
  emp.sprite.x = pos.x;
  emp.sprite.y = pos.y - 14;
  emp.sprite.setDepth(emp.gx + emp.gy + 1);
  emp.label.x = pos.x;
  emp.label.y = pos.y - 14;
  emp.label.setDepth(emp.gx + emp.gy + 2);
};

MainScene.prototype.moveEmp = function(emp, tx, ty, speed, delta) {
  const dx = tx - emp.gx;
  const dy = ty - emp.gy;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < 0.08) { emp.gx = tx; emp.gy = ty; return true; }
  const step = speed * delta;
  if (step >= dist) { emp.gx = tx; emp.gy = ty; return true; }
  emp.gx += (dx / dist) * step;
  emp.gy += (dy / dist) * step;
  return false;
};

MainScene.prototype.findFacilityPos = function(label) {
  for (let i = 0; i < this.facilities.length; i++) {
    if (this.facilities[i].label === label) {
      return { gx: this.facilities[i].gx, gy: this.facilities[i].gy };
    }
  }
  return null;
};

MainScene.prototype.updateChef = function(delta) {
  const chef = this.chef;
  if (chef.state === 'idle') {
    const order = this.orders.find(function(o){ return o.type === 'back' && o.stage === 'new'; });
    if (order) {
      const pos = this.findFacilityPos(order.station);
      if (pos) {
        chef.tx = pos.gx; chef.ty = pos.gy;
        chef.state = 'to_station';
        chef.currentOrder = order;
        order.stage = 'chef_working';
      }
    }
  } else if (chef.state === 'to_station') {
    if (this.moveEmp(chef, chef.tx, chef.ty, 0.009, delta)) {
      chef.state = 'cooking'; chef.timer = 2500;
    }
  } else if (chef.state === 'cooking') {
    chef.timer -= delta;
    if (chef.timer <= 0) {
      const pos = this.findFacilityPos('出餐台');
      chef.tx = pos.gx; chef.ty = pos.gy;
      chef.state = 'to_pass';
    }
  } else if (chef.state === 'to_pass') {
    if (this.moveEmp(chef, chef.tx, chef.ty, 0.009, delta)) {
      if (chef.currentOrder) {
        chef.currentOrder.stage = 'onPass';
        this.showFeedback('🔔 叮铃铃！' + chef.currentOrder.dish + ' 出餐台好了');
        chef.currentOrder = null;
      }
      chef.state = 'idle';
    }
  }
  this.updateEmployeeSprite(chef);
};

MainScene.prototype.updateWaiter = function(delta) {
  const w = this.waiter;
  if (w.state === 'idle') {
    const passOrder = this.orders.find(function(o){ return o.stage === 'onPass'; });
    if (passOrder) {
      const pos = this.findFacilityPos('出餐台');
      w.tx = pos.gx; w.ty = pos.gy;
      w.state = 'to_pass_take';
      w.currentOrder = passOrder;
      passOrder.stage = 'waiter_taking';
    } else {
      const frontOrder = this.orders.find(function(o){ return o.type === 'front' && o.stage === 'new'; });
      if (frontOrder) {
        const pos = this.findFacilityPos(frontOrder.station);
        w.tx = pos.gx; w.ty = pos.gy;
        w.state = 'to_front';
        w.currentOrder = frontOrder;
        frontOrder.stage = 'waiter_working';
      }
    }
  } else if (w.state === 'to_pass_take') {
    if (this.moveEmp(w, w.tx, w.ty, 0.01, delta)) {
      const pos = this.findFacilityPos('取餐台');
      w.tx = pos.gx; w.ty = pos.gy;
      w.state = 'to_pickup_pass';
    }
  } else if (w.state === 'to_pickup_pass') {
    if (this.moveEmp(w, w.tx, w.ty, 0.01, delta)) {
      if (w.currentOrder && w.currentOrder.stage === 'waiter_taking') {
        w.currentOrder.stage = 'onPickup';
        w.currentOrder = null;
      }
      w.state = 'idle';
    }
  } else if (w.state === 'to_front') {
    if (this.moveEmp(w, w.tx, w.ty, 0.01, delta)) {
      w.state = 'front_cooking'; w.timer = 2000;
    }
  } else if (w.state === 'front_cooking') {
    w.timer -= delta;
    if (w.timer <= 0) {
      const pos = this.findFacilityPos('取餐台');
      w.tx = pos.gx; w.ty = pos.gy;
      w.state = 'to_pickup_front';
    }
  } else if (w.state === 'to_pickup_front') {
    if (this.moveEmp(w, w.tx, w.ty, 0.01, delta)) {
      if (w.currentOrder && w.currentOrder.stage === 'waiter_working') {
        w.currentOrder.stage = 'onPickup';
        w.currentOrder = null;
      }
      w.state = 'idle';
    }
  }
  this.updateEmployeeSprite(w);
};

MainScene.prototype.updateServer = function(delta) {
  const s = this.server;
  if (s.state === 'idle') {
    const belled = this.tableSlots.find(function(t){ return t.bell; });
    if (belled) {
      this.setEmployeeTag(s, '桌');
      s.tx = belled.gx; s.ty = belled.gy + 1;
      s.currentTable = belled;
      s.state = 'to_table_order';
      return;
    }
    const tableReady = this.orders.find(function(o){ return o.delivery === 'table' && o.stage === 'onPickup'; });
    if (tableReady) {
      this.setEmployeeTag(s, '桌');
      const pos = this.findFacilityPos('取餐台');
      s.tx = pos.gx; s.ty = pos.gy;
      s.state = 'to_pickup_table';
      s.currentOrder = tableReady;
      return;
    }
    if (this.dirtyTables.length > 0) {
      this.setEmployeeTag(s, '服');
      const t = this.dirtyTables[0];
      s.tx = t.gx; s.ty = t.gy + 1;
      s.currentTable = t;
      s.state = 'to_dirty_table';
      return;
    }
  }

  if (s.state === 'to_table_order') {
    if (this.moveEmp(s, s.tx, s.ty, 0.01, delta)) { s.state = 'taking_order'; s.timer = 1500; }
  } else if (s.state === 'taking_order') {
    s.timer -= delta;
    if (s.timer <= 0) {
      const t = s.currentTable;
      if (t && t.eaters > 0) {
        const dish = this.pickRandomDish();
        if (dish) {
          const info = DISHES[dish];
          const order = {
            dish: dish, price: info.price,
            station: info.station, type: info.type,
            delivery: 'table', tableGx: t.gx, tableGy: t.gy,
            stage: 'new'
          };
          this.orders.push(order);
          for (let i = 0; i < this.customers.length; i++) {
            const c = this.customers[i];
            if (c.tableGx === t.gx && c.tableGy === t.gy && c.state === 'seated') {
              c.order = order; c.orderedDish = dish;
              c.state = 'waiting_food'; c.bubble.setText('⏳');
            }
          }
          this.updateOrderCount();
          this.coinCount += info.price;
          this.updateCoinDisplay();
          this.showFeedback('桌边收银：' + dish + ' +' + info.price);
          t.bell = false;
        }
      }
      s.currentTable = null;
      const cashier = this.findFacilityPos('点餐台');
      s.tx = cashier.gx; s.ty = cashier.gy + 1;
      s.state = 'to_cashier';
    }
  } else if (s.state === 'to_cashier') {
    if (this.moveEmp(s, s.tx, s.ty, 0.01, delta)) { s.state = 'idle'; }
  } else if (s.state === 'to_pickup_table') {
    if (this.moveEmp(s, s.tx, s.ty, 0.01, delta)) {
      if (s.currentOrder) {
        s.tx = s.currentOrder.tableGx;
        s.ty = s.currentOrder.tableGy + 1;
        s.state = 'to_table_deliver';
      } else { s.state = 'idle'; }
    }
  } else if (s.state === 'to_table_deliver') {
    if (this.moveEmp(s, s.tx, s.ty, 0.01, delta)) {
      if (s.currentOrder) {
        const order = s.currentOrder;
        for (let i = 0; i < this.customers.length; i++) {
          const c = this.customers[i];
          if (c.order === order && c.state === 'waiting_food') {
            c.state = 'eating'; c.eatTimer = 2500; c.bubble.setText('~');
          }
        }
        const idx = this.orders.indexOf(order);
        if (idx >= 0) this.orders.splice(idx, 1);
        this.updateOrderCount();
        s.currentOrder = null;
      }
      s.state = 'idle';
    }
  } else if (s.state === 'to_dirty_table') {
    if (this.moveEmp(s, s.tx, s.ty, 0.009, delta)) {
      if (s.currentTable) {
        this.dirtyTables.shift();
        s.currentTable.state = 'free';
        s.currentTable.eaters = 0;
        s.currentTable = null;
      }
      const pos = this.findFacilityPos('清洗区');
      s.tx = pos.gx; s.ty = pos.gy;
      s.state = 'to_clean_area';
    }
  } else if (s.state === 'to_clean_area') {
    if (this.moveEmp(s, s.tx, s.ty, 0.009, delta)) {
      this.dirtyPlates++;
      this.dirtyText && this.dirtyText.setText('脏盘: ' + this.dirtyPlates);
      s.state = 'idle';
    }
  }
  this.updateEmployeeSprite(s);
};

MainScene.prototype.updateCleaner = function(delta) {
  const c = this.cleaner;
  if (c.state === 'idle') {
    if (this.dirtyPlates > 0) {
      const pos = this.findFacilityPos('清洗区');
      c.tx = pos.gx; c.ty = pos.gy;
      c.state = 'to_clean_area';
    }
  } else if (c.state === 'to_clean_area') {
    if (this.moveEmp(c, c.tx, c.ty, 0.009, delta)) {
      const pos = this.findFacilityPos('洗碗池');
      c.tx = pos.gx; c.ty = pos.gy;
      c.state = 'to_sink';
    }
  } else if (c.state === 'to_sink') {
    if (this.moveEmp(c, c.tx, c.ty, 0.009, delta)) {
      if (this.dirtyPlates > 0) this.dirtyPlates--;
      this.dirtyText && this.dirtyText.setText('脏盘: ' + this.dirtyPlates);
      c.state = 'idle';
    }
  }
  this.updateEmployeeSprite(c);
};

MainScene.prototype.findFreeOneTable = function() {
  for (let i = 0; i < this.tableSlots.length; i++) {
    const t = this.tableSlots[i];
    if (t.state !== 'free') continue;
    const fac = this.facilities.find(function(f){ return f.gx === t.gx && f.gy === t.gy; });
    if (fac && fac.label === '一人桌') return t;
  }
  return this.tableSlots.find(function(t){ return t.state === 'free'; });
};

MainScene.prototype.findFreeGroupTable = function() {
  for (let i = 0; i < this.tableSlots.length; i++) {
    const t = this.tableSlots[i];
    if (t.state !== 'free') continue;
    const fac = this.facilities.find(function(f){ return f.gx === t.gx && f.gy === t.gy; });
    if (fac && (fac.label === '两人桌' || fac.label === '四人桌')) return t;
  }
  return null;
};

MainScene.prototype.spawnCustomer = function() {
  const rand = Math.random();
  if (rand < 0.2) this.spawnGroup(2);
  else if (rand < 0.3) this.spawnGroup(4);
  else this.spawnSingle();
};

MainScene.prototype.spawnSingle = function() {
  const self = this;
  const useTable = Math.random() < 0.4;
  const startPos = gridToScreen(4, 16);
  if (!useTable) {
    const freeSlot = this.queueSlots.find(function(slot){
      return !self.customers.some(function(c){
        return (c.state === 'to_queue' || c.state === 'waiting') &&
               c.targetGridX === slot.gx && c.targetGridY === slot.gy;
      });
    });
    if (!freeSlot) return;
    const rect = this.add.rectangle(startPos.x, startPos.y - 14, 22, 22, 0xff6b6b).setStrokeStyle(2, 0x000000).setDepth(50);
    const bubble = this.add.text(startPos.x, startPos.y - 36, '...', {
      fontSize: '12px', color: '#ffffff', backgroundColor: '#000000aa', padding: { x: 3, y: 2 }
    }).setOrigin(0.5).setDepth(51);
    this.customers.push({
      gridX: 4, gridY: 16,
      targetGridX: freeSlot.gx, targetGridY: freeSlot.gy,
      state: 'to_queue', rect: rect, bubble: bubble,
      eatTimer: 0, tableGx: -1, tableGy: -1,
      orderedDish: '', order: null, mode: 'queue',
    });
  } else {
    const table = this.findFreeOneTable();
    if (!table) return;
    table.state = 'eating'; table.eaters = 1;
    const rect = this.add.rectangle(startPos.x, startPos.y - 14, 22, 22, 0xe74c3c).setStrokeStyle(2, 0x000000).setDepth(50);
    const bubble = this.add.text(startPos.x, startPos.y - 36, '...', {
      fontSize: '12px', color: '#ffffff', backgroundColor: '#000000aa', padding: { x: 3, y: 2 }
    }).setOrigin(0.5).setDepth(51);
    this.customers.push({
      gridX: 4, gridY: 16,
      targetGridX: table.gx, targetGridY: table.gy + 1,
      state: 'to_seat', rect: rect, bubble: bubble,
      eatTimer: 0, tableGx: table.gx, tableGy: table.gy,
      orderedDish: '', order: null, mode: 'table',
    });
  }
};

MainScene.prototype.spawnGroup = function(size) {
  const self = this;
  const table = this.findFreeGroupTable();
  if (!table) return;
  table.state = 'eating'; table.eaters = size - 1;
  const startPos = gridToScreen(4, 16);

  for (let i = 0; i < size - 1; i++) {
    const rect = this.add.rectangle(startPos.x + (i - 1) * 15, startPos.y - 14, 22, 22, 0xe74c3c).setStrokeStyle(2, 0x000000).setDepth(50);
    const bubble = this.add.text(rect.x, rect.y - 22, '...', {
      fontSize: '12px', color: '#ffffff', backgroundColor: '#000000aa', padding: { x: 3, y: 2 }
    }).setOrigin(0.5).setDepth(51);
    const offsetX = (i % 2) * 0.4 - 0.2;
    const offsetY = Math.floor(i / 2) * 0.4 - 0.2;
    this.customers.push({
      gridX: 4, gridY: 16,
      targetGridX: table.gx + offsetX, targetGridY: table.gy + 1 + offsetY,
      state: 'to_seat', rect: rect, bubble: bubble,
      eatTimer: 0, tableGx: table.gx, tableGy: table.gy,
      orderedDish: '', order: null, mode: 'table', groupSize: size,
    });
  }

  const freeSlot = this.queueSlots.find(function(slot){
    return !self.customers.some(function(c){
      return (c.state === 'to_queue' || c.state === 'waiting') &&
             c.targetGridX === slot.gx && c.targetGridY === slot.gy;
    });
  });
  if (!freeSlot) return;
  const rect = this.add.rectangle(startPos.x, startPos.y - 14, 22, 22, 0xff6b6b).setStrokeStyle(2, 0x000000).setDepth(50);
  const bubble = this.add.text(startPos.x, startPos.y - 36, '...', {
    fontSize: '12px', color: '#ffffff', backgroundColor: '#000000aa', padding: { x: 3, y: 2 }
  }).setOrigin(0.5).setDepth(51);
  this.customers.push({
    gridX: 4, gridY: 16,
    targetGridX: freeSlot.gx, targetGridY: freeSlot.gy,
    state: 'to_queue', rect: rect, bubble: bubble,
    eatTimer: 0, tableGx: -1, tableGy: -1,
    orderedDish: '', order: null, mode: 'queue', groupSize: size,
  });
};

MainScene.prototype.updateCustomers = function(delta) {
  const self = this;
  for (let i = this.customers.length - 1; i >= 0; i--) {
    const c = this.customers[i];

    if (c.state === 'eating') {
      c.eatTimer -= delta;
      if (c.eatTimer <= 0) {
        const stars = Math.floor(Math.random() * 3) + 3;
        let starStr = '';
        for (let k = 0; k < 5; k++) starStr += (k < stars ? '★' : '☆');
        const pos0 = gridToScreen(c.gridX, c.gridY);
        const reviewText = self.add.text(pos0.x, pos0.y - 50, c.orderedDish + ' ' + starStr, {
          fontSize: '14px', color: '#ffffff', backgroundColor: '#000000cc', padding: { x: 4, y: 2 }
        }).setOrigin(0.5).setDepth(300);
        self.tweens.add({
          targets: reviewText, y: pos0.y - 90, alpha: 0, duration: 2000,
          onComplete: function(){ reviewText.destroy(); }
        });
        if (stars >= 5) self.addStars(3);
        if (c.tableGx >= 0) {
          for (let t of self.tableSlots) {
            if (t.gx === c.tableGx && t.gy === c.tableGy) {
              t.eaters -= 1;
              if (t.eaters <= 0 && t.state === 'eating') {
                t.state = 'dirty'; t.eaters = 0;
                self.dirtyTables.push(t);
              }
              break;
            }
          }
        }
        c.state = 'leaving';
        c.targetGridX = 4; c.targetGridY = 16;
        c.bubble.setText('👋');
      }
    }

    if (c.state === 'pickup_waiting' && c.order && c.order.stage === 'onPickup') {
      const pos = self.findFacilityPos('取餐台');
      c.targetGridX = pos.gx; c.targetGridY = pos.gy + 1;
      c.state = 'to_pickup';
    }

    if (c.state === 'seated' && c.mode === 'table') {
      let alreadyBell = false;
      for (let t of self.tableSlots) {
        if (t.gx === c.tableGx && t.gy === c.tableGy && t.bell) { alreadyBell = true; break; }
      }
      if (!alreadyBell) {
        for (let t of self.tableSlots) {
          if (t.gx === c.tableGx && t.gy === c.tableGy && t.eaters > 0) {
            t.bell = true; c.bubble.setText('🔔'); break;
          }
        }
      }
    }

    const dx = c.targetGridX - c.gridX;
    const dy = c.targetGridY - c.gridY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const moveSpeed = 0.005 * delta;

    if (dist > 0.08) {
      c.gridX += (dx / dist) * moveSpeed;
      c.gridY += (dy / dist) * moveSpeed;
    } else {
      c.gridX = c.targetGridX;
      c.gridY = c.targetGridY;

      if (c.state === 'to_queue') c.state = 'waiting';
      else if (c.state === 'to_pickup_queue') c.state = 'pickup_waiting';
      else if (c.state === 'to_seat') c.state = 'seated';
      else if (c.state === 'to_pickup') {
        if (c.order) {
          const idx = self.orders.indexOf(c.order);
          if (idx >= 0) self.orders.splice(idx, 1);
          self.updateOrderCount();
          c.order = null;
        }
        const freeTable = self.tableSlots.find(function(t){ return t.state === 'free'; });
        if (freeTable) {
          freeTable.state = 'eating'; freeTable.eaters = 1;
          c.tableGx = freeTable.gx; c.tableGy = freeTable.gy;
          c.targetGridX = freeTable.gx; c.targetGridY = freeTable.gy + 1;
          c.state = 'to_table';
        } else {
          c.state = 'leaving'; c.targetGridX = 4; c.targetGridY = 16;
        }
      } else if (c.state === 'to_table') {
        c.state = 'eating'; c.eatTimer = 2500; c.bubble.setText('~');
      } else if (c.state === 'leaving') {
        if (c.gridY > 15.5) {
          c.rect.destroy(); c.bubble.destroy();
          self.customers.splice(i, 1);
          continue;
        }
      }
    }

    const pos = gridToScreen(c.gridX, c.gridY);
    c.rect.x = pos.x; c.rect.y = pos.y - 14;
    c.bubble.x = pos.x;
    c.bubble.y = pos.y - 36 + Math.sin(this.time.now / 300) * 2;
    c.rect.setDepth(c.gridX + c.gridY + 1);
    c.bubble.setDepth(c.gridX + c.gridY + 2);
  }
};

MainScene.prototype.update = function(time, delta) {
  const self = this;

  // 时间推进
  this.timeAccum += delta;
  while (this.timeAccum >= TIME_STEP_MS) {
    this.timeAccum -= TIME_STEP_MS;
    this.gameMinutes += 10;
    if (this.gameMinutes >= 1440) {
      this.gameMinutes -= 1440;
      this.gameDay += 1;
      if (this.gameDay > 30) {
        this.gameDay = 1;
        this.gameMonth += 1;
        if (this.gameMonth > 12) {
          this.gameMonth = 1;
          this.gameYear += 1;
        }
      }
    }
  }
  const h = Math.floor(this.gameMinutes / 60);
  const m = this.gameMinutes % 60;
  const hs = (h < 10 ? '0' : '') + h;
  const ms = (m < 10 ? '0' : '') + m;
  this.timeText.setText(this.gameYear + '年' + this.gameMonth + '月 ' + hs + ':' + ms);
  this.timeText2.setText('第' + this.gameDay + '天');

  let dx = this.menuOpen ? 0 : this.moveX;
  let dy = this.menuOpen ? 0 : this.moveY;
  if (!this.menuOpen) {
    if (this.cursors.left.isDown || this.keys.A.isDown) dx = -1;
    if (this.cursors.right.isDown || this.keys.D.isDown) dx = 1;
    if (this.cursors.up.isDown || this.keys.W.isDown) dy = -1;
    if (this.cursors.down.isDown || this.keys.S.isDown) dy = 1;
  }

  if (dx !== 0 || dy !== 0) {
    const gridDx = (dx / (TILE_W / 2) + dy / (TILE_H / 2)) / 2;
    const gridDy = (dy / (TILE_H / 2) - dx / (TILE_W / 2)) / 2;
    this.playerGridX += gridDx * delta * 0.03;
    this.playerGridY += gridDy * delta * 0.03;
    this.playerGridX = Phaser.Math.Clamp(this.playerGridX, 0, GRID_W - 1);
    this.playerGridY = Phaser.Math.Clamp(this.playerGridY, 0, GRID_H - 1);
    const pos = gridToScreen(this.playerGridX, this.playerGridY);
    this.player.x = pos.x;
    this.player.y = pos.y - 14;
    this.player.setDepth(this.playerGridX + this.playerGridY + 1);
  }

  this.spawnTimer += delta;
  if (this.spawnTimer > this.spawnInterval) {
    this.spawnTimer = 0;
    this.spawnCustomer();
  }
  this.updateCustomers(delta);
  this.updateChef(delta);
  this.updateWaiter(delta);
  this.updateServer(delta);
  this.updateCleaner(delta);

  let nearest = null;
  for (let i = 0; i < this.facilities.length; i++) {
    const f = this.facilities[i];
    if (f.label !== '点餐台' && f.label !== '工作电脑') continue;
    const dist = Phaser.Math.Distance.Between(this.playerGridX, this.playerGridY, f.gx, f.gy);
    if (dist < 1.4) nearest = f;
  }
  this.currentFacility = nearest;

  if (this.menuOpen) {
    this.interactButton.setVisible(false);
    this.interactText.setVisible(false);
    return;
  }

  if (nearest) {
    this.interactButton.setVisible(true);
    this.interactText.setVisible(true);
    if (nearest.label === '工作电脑') {
      this.interactText.setText('菜单管理');
    } else {
      this.interactText.setText('接单+收钱');
    }
  } else {
    this.interactButton.setVisible(false);
    this.interactText.setVisible(false);
  }
};

const config = {
  type: Phaser.AUTO,
  parent: 'game',
  width: 720,
  height: 1280,
  backgroundColor: '#2b1d14',
  pixelArt: true,
  roundPixels: true,
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH
  },
  scene: [MainScene]
};

new Phaser.Game(config);
</script>
