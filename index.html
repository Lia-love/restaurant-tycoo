<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>餐厅区块大亨</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#2b1d14; touch-action:none; }
  #game { width:100vw; height:100vh; }
  canvas { display:block; image-rendering:pixelated; }
</style>
</head>
<body>
<div id="game"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.0/phaser.min.js"></script>
<script>
const TILE_W = 64;
const TILE_H = 32;
const GRID_W = 10;
const GRID_H = 10;
const ORIGIN_X = 360;
const ORIGIN_Y = 400;

function gridToScreen(gx, gy) {
  return {
    x: ORIGIN_X + (gx - gy) * (TILE_W / 2),
    y: ORIGIN_Y + (gx + gy) * (TILE_H / 2)
  };
}

function MainScene() {
  Phaser.Scene.call(this, { key: 'MainScene' });
}
MainScene.prototype = Object.create(Phaser.Scene.prototype);
MainScene.prototype.constructor = MainScene;

MainScene.prototype.create = function() {
  this.orderStatus = 0;
  this.coinCount = 0;

  // 网格
  this.graphics = this.add.graphics();
  this.graphics.lineStyle(2, 0x4a2f1e, 0.8);
  for (let gy = 0; gy < GRID_H; gy++) {
    for (let gx = 0; gx < GRID_W; gx++) {
      const p = gridToScreen(gx, gy);
      const points = [
        { x: p.x, y: p.y - TILE_H / 2 },
        { x: p.x + TILE_W / 2, y: p.y },
        { x: p.x, y: p.y + TILE_H / 2 },
        { x: p.x - TILE_W / 2, y: p.y }
      ];
      this.graphics.strokePoints(points, true, true);
    }
  }

  // 设施
  this.facilities = [];
  const self = this;
  function addFacility(gx, gy, color, label) {
    const pos = gridToScreen(gx, gy);
    const rect = self.add.rectangle(pos.x, pos.y - 10, 44, 30, color).setStrokeStyle(2, 0x000000);
    rect.setDepth(gx + gy);
    self.add.text(pos.x, pos.y - 10, label, {
      fontSize: '13px', color: '#ffffff', fontStyle: 'bold'
    }).setOrigin(0.5).setDepth(gx + gy + 1);
    self.facilities.push({ gx, gy, label, rect });
  }

  // ============ 后厨区（上方）============
  addFacility(3, 1, 0xe67e22, '灶台');
  addFacility(4, 1, 0x9b59b6, '出餐口');

  // ============ 前区（点餐台在出餐口下方）============
  addFacility(4, 2, 0x3498db, '点餐台');

  // ============ 就餐区（下方）============
  // 一人桌（左侧一列）
  addFacility(1, 5, 0xf1c40f, '一人桌');
  addFacility(1, 6, 0xf1c40f, '一人桌');
  addFacility(1, 7, 0xf1c40f, '一人桌');
  addFacility(1, 8, 0xf1c40f, '一人桌');
  addFacility(2, 8, 0xf1c40f, '一人桌');

  // 两人桌（中间一列）
  addFacility(4, 5, 0xf39c12, '两人桌');
  addFacility(4, 6, 0xf39c12, '两人桌');
  addFacility(4, 7, 0xf39c12, '两人桌');
  addFacility(4, 8, 0xf39c12, '两人桌');
  addFacility(5, 8, 0xf39c12, '两人桌');

  // 四人桌（右侧一列）
  addFacility(7, 5, 0xd35400, '四人桌');
  addFacility(7, 6, 0xd35400, '四人桌');
  addFacility(7, 7, 0xd35400, '四人桌');
  addFacility(7, 8, 0xd35400, '四人桌');
  addFacility(8, 8, 0xd35400, '四人桌');

  // 老板起点
  this.playerGridX = 5;
  this.playerGridY = 4;
  const pos = gridToScreen(this.playerGridX, this.playerGridY);
  this.player = this.add.rectangle(pos.x, pos.y - 16, 32, 32, 0x4a90e2).setStrokeStyle(2, 0xffcc66);
  this.player.setDepth(this.playerGridX + this.playerGridY + 1);

  // 摇杆
  this.joyBase = this.add.circle(150, 1100, 80, 0xffffff, 0.2).setDepth(100);
  this.joyKnob = this.add.circle(150, 1100, 40, 0xffcc66, 0.8).setDepth(101);
  this.isJoyActive = false;
  this.joyStartX = 150;
  this.joyStartY = 1100;
  this.moveX = 0;
  this.moveY = 0;

  this.input.on('pointerdown', (pointer) => {
    if (pointer.x < 300 && pointer.y > 900) {
      this.isJoyActive = true;
      this.joyStartX = pointer.x;
      this.joyStartY = pointer.y;
    }
  });
  this.input.on('pointermove', (pointer) => {
    if (!this.isJoyActive) return;
    const dx = pointer.x - this.joyStartX;
    const dy = pointer.y - this.joyStartY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const maxDist = 60;
    if (dist > 0) {
      const angle = Math.atan2(dy, dx);
      const clampedDist = Math.min(dist, maxDist);
      const moveDx = Math.cos(angle) * clampedDist;
      const moveDy = Math.sin(angle) * clampedDist;
      this.joyKnob.x = this.joyStartX + moveDx;
      this.joyKnob.y = this.joyStartY + moveDy;
      this.moveX = moveDx / maxDist;
      this.moveY = moveDy / maxDist;
    }
  });
  this.input.on('pointerup', () => {
    this.isJoyActive = false;
    this.moveX = 0;
    this.moveY = 0;
    this.joyKnob.x = 150;
    this.joyKnob.y = 1100;
  });

  // 互动按钮
  this.interactButton = this.add.circle(600, 1100, 60, 0xe74c3c, 0.8).setDepth(100).setVisible(false);
  this.interactButton.setInteractive({ useHandCursor: true });
  this.interactText = this.add.text(600, 1100, '互动', {
    fontSize: '24px', color: '#ffffff', fontStyle: 'bold'
  }).setOrigin(0.5).setDepth(101).setVisible(false);

  // 状态显示
  this.statusText = this.add.text(360, 50, '状态：等待点餐', {
    fontSize: '28px', color: '#ffffff', fontStyle: 'bold'
  }).setOrigin(0.5).setDepth(200);
  this.coinText = this.add.text(680, 50, '金币: 0', {
    fontSize: '24px', color: '#ffcc66', fontStyle: 'bold'
  }).setOrigin(1, 0.5).setDepth(200);
  this.feedbackText = this.add.text(360, 150, '', {
    fontSize: '32px', color: '#ffcc66', fontStyle: 'bold'
  }).setOrigin(0.5).setDepth(200).setVisible(false);

  // 互动点击
  this.interactButton.on('pointerdown', () => {
    if (!this.currentFacility) return;
    const label = this.currentFacility.label;
    let msg = '';

    if (label === '点餐台') {
      if (this.orderStatus === 0) {
        this.orderStatus = 1;
        msg = '顾客点餐成功！';
        this.statusText.setText('状态：等待做菜');
      } else {
        msg = '已经有订单了！';
      }
    } else if (label === '灶台') {
      if (this.orderStatus === 1) {
        this.orderStatus = 2;
        msg = '菜品制作完成！';
        this.statusText.setText('状态：等待出餐');
      } else {
        msg = '没有需要制作的订单。';
      }
    } else if (label === '出餐口') {
      if (this.orderStatus === 2) {
        this.orderStatus = 3;
        msg = '拿到餐品，去送餐吧！';
        this.statusText.setText('状态：正在送餐');
      } else {
        msg = '没有做好的餐品。';
      }
    } else if (label.includes('桌')) {
      if (this.orderStatus === 3) {
        this.orderStatus = 0;
        this.coinCount += 30;
        msg = '送餐成功！获得30金币！';
        this.statusText.setText('状态：等待点餐');
        this.coinText.setText('金币: ' + this.coinCount);
      } else {
        msg = '现在没有餐品可以送。';
      }
    }

    this.feedbackText.setText(msg).setVisible(true);
    this.time.delayedCall(1200, () => this.feedbackText.setVisible(false));
  });

  this.cursors = this.input.keyboard.createCursorKeys();
  this.keys = this.input.keyboard.addKeys('W,A,S,D');
};

MainScene.prototype.update = function(time, delta) {
  const speed = 0.005;
  let dx = this.moveX;
  let dy = this.moveY;
  if (this.cursors.left.isDown || this.keys.A.isDown) dx = -1;
  if (this.cursors.right.isDown || this.keys.D.isDown) dx = 1;
  if (this.cursors.up.isDown || this.keys.W.isDown) dy = -1;
  if (this.cursors.down.isDown || this.keys.S.isDown) dy = 1;

  if (dx !== 0 || dy !== 0) {
    const gridDx = (dx / (TILE_W / 2) + dy / (TILE_H / 2)) / 2;
    const gridDy = (dy / (TILE_H / 2) - dx / (TILE_W / 2)) / 2;
    this.playerGridX += gridDx * delta * speed;
    this.playerGridY += gridDy * delta * speed;
    this.playerGridX = Phaser.Math.Clamp(this.playerGridX, 0, GRID_W - 1);
    this.playerGridY = Phaser.Math.Clamp(this.playerGridY, 0, GRID_H - 1);
    const pos = gridToScreen(this.playerGridX, this.playerGridY);
    this.player.x = pos.x;
    this.player.y = pos.y - 16;
    this.player.setDepth(this.playerGridX + this.playerGridY + 1);
  }

  let nearestFacility = null;
  let minDist = 1.5;
  for (let i = 0; i < this.facilities.length; i++) {
    const fac = this.facilities[i];
    const dist = Phaser.Math.Distance.Between(this.playerGridX, this.playerGridY, fac.gx, fac.gy);
    if (dist < minDist) {
      minDist = dist;
      nearestFacility = fac;
    }
  }
  this.currentFacility = nearestFacility;
  if (nearestFacility) {
    this.interactButton.setVisible(true);
    this.interactText.setVisible(true);
  } else {
    this.interactButton.setVisible(false);
    this.interactText.setVisible(false);
  }
};

const config = {
  type: Phaser.AUTO,
  parent: 'game',
  width: 720,
  height: 1280,
  backgroundColor: '#2b1d14',
  pixelArt: true,
  roundPixels: true,
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH
  },
  scene: [MainScene]
};

new Phaser.Game(config);
</script>
</body>
</html>
